services:
  rice:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RICE_ACCESS_TOKEN: ${RICE_ACCESS_TOKEN:-}
    cpus: 2.0
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
